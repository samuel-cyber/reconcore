  <text x="419" y="250" font-family="monospace" font-size="14" fill="#334155">2026-10-14</text>
  <text x="525" y="250" font-family="monospace" font-size="14" fill="#0F172A">37,500</text>
  <text x="625" y="250" font-family="sans-serif" font-size="14" fill="#334155">Transfer</text>
  <text x="710" y="250" font-family="monospace" font-size="14" fill="#334155">TRF-88162</text>
  <line x1="307" y1="265" x2="774" y2="265" stroke="#E2E8F0"/>

