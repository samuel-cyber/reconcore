  <text x="319" y="332" font-family="monospace" font-size="14" font-weight="600" fill="#0F172A">POS-1043</text>
  <text x="419" y="332" font-family="monospace" font-size="14" fill="#334155">2026-10-15</text>
  <text x="525" y="332" font-family="monospace" font-size="14" fill="#0F172A">30000</text>
  <text x="625" y="332" font-family="sans-serif" font-size="14" fill="#334155">transfer</text>
  <text x="710" y="332" font-family="monospace" font-size="14" fill="#334155">TRF-88241</text>
  <line x1="307" y1="347" x2="774" y2="347" stroke="#E2E8F0"/>

