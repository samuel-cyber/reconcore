<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" fill="none" role="img" aria-label="ReconCore Workspace Preview">
  <rect width="800" height="460" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
