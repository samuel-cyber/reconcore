  <text x="525" y="210" font-family="monospace" font-size="14" fill="#0F172A">65,000</text>
  <text x="625" y="210" font-family="sans-serif" font-size="14" fill="#334155">TRANSFER</text>
  <text x="710" y="210" font-family="monospace" font-size="14" fill="#334155">TRF-88139</text>
  <line x1="307" y1="224" x2="774" y2="224" stroke="#E2E8F0"/>

