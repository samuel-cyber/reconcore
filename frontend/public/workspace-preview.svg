  <text x="588" y="28" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Attempts: 1</text>
  
  <rect x="648" y="12" width="134" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="715" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Correct: 2/3</text>

  <!-- Left Pane (35% = 280px) -->
