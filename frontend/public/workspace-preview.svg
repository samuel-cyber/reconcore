  <rect x="307" y="348" width="467" height="40" fill="#F8FAFC"/>
  <text x="319" y="373" font-family="monospace" font-size="14" font-weight="600" fill="#0F172A">POS-1046</text>
  <text x="419" y="373" font-family="monospace" font-size="14" fill="#334155">15/10/2026</text>
  <text x="525" y="373" font-family="monospace" font-size="14" fill="#0F172A">48,000.00</text>
  <text x="625" y="373" font-family="sans-serif" font-size="14" fill="#334155">Transfer</text>
  <text x="710" y="373" font-family="monospace" font-size="14" fill="#334155">TRF-88276</text>

