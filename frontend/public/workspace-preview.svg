  <!-- Left Pane Form Fields (24px padding, 16px gap) -->
  <text x="25" y="118" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">1. Total net discrepancy (₦)</text>
  <rect x="25" y="126" width="232" height="36" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="37" y="149" font-family="monospace" font-size="13" font-weight="600" fill="#065F46">45,000</text>
  <text x="245" y="149" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="end">✓ Locked</text>

  <text x="25" y="186" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">2. Missing bank transaction ID</text>
  <rect x="25" y="194" width="232" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="37" y="217" font-family="monospace" font-size="13" font-weight="600" fill="#0F172A">POS-1042</text>

  <text x="25" y="254" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">3. Duplicated waybill ID</text>
  <rect x="25" y="262" width="232" height="36" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="37" y="285" font-family="monospace" font-size="13" font-weight="600" fill="#065F46">WB-3311</text>
